<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="white"/>
<rect x="72" y="54" width="9" height="85" rx="0" fill="#007D80" stroke="none" stroke-width="1"/>
<text x="105" y="90.64" fill="#152C3A" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" text-anchor="start"><tspan x="105" dy="0">Design capacity expands. Validation must keep up.</tspan></text>
<text x="106" y="139.32" fill="#647887" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="106" dy="0">Illustrative stage comparison, normalized per one clinical entrant. Supplied assumptions, not cohort statistics.</tspan></text>
<line x1="72" y1="176" x2="1848" y2="176" stroke="#D7E3E8" stroke-width="1" />
<rect x="72" y="230" width="515" height="70" fill="#152C3A"/>
<text x="94" y="272.5" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="94" dy="0">STAGE</tspan></text>
<rect x="587" y="230" width="190" height="70" fill="#152C3A"/>
<text x="682" y="272.5" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="682" dy="0">PRE-AI</tspan></text>
<rect x="777" y="230" width="255" height="70" fill="#152C3A"/>
<text x="904.5" y="272.5" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle"><tspan x="904.5" dy="0">AI ERA</tspan></text>
<rect x="1032" y="230" width="816" height="70" fill="#152C3A"/>
<text x="1054" y="272.5" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="1054" dy="0">WHAT CHANGES</tspan></text>
<line x1="72" y1="300" x2="1848" y2="300" stroke="#D7E3E8"/>
<rect x="72" y="300" width="515" height="116" fill="#FFFFFF"/>
<text x="94" y="351.75" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="94" dy="0">Molecules designed</tspan><tspan x="94" dy="31.25">(virtual)</tspan></text>
<rect x="587" y="300" width="190" height="116" fill="#FFFFFF"/>
<text x="682" y="370" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="682" dy="0">~10³</tspan></text>
<rect x="777" y="300" width="255" height="116" fill="#FFFFFF"/>
<text x="904.5" y="370" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="904.5" dy="0">10⁵–10⁹</tspan></text>
<rect x="1032" y="300" width="816" height="116" fill="#FFFFFF"/>
<text x="1054" y="351.75" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="1054" dy="0">Generative models can expand</tspan><tspan x="1054" dy="31.25">candidate enumeration at low marginal cost.</tspan></text>
<line x1="72" y1="416" x2="1848" y2="416" stroke="#D7E3E8"/>
<rect x="72" y="416" width="515" height="105" fill="#EAF6F4"/>
<text x="94" y="477.875" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="94" dy="0">Molecules physically made</tspan></text>
<rect x="587" y="416" width="190" height="105" fill="#EAF6F4"/>
<text x="682" y="480.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="682" dy="0">~10³</tspan></text>
<rect x="777" y="416" width="255" height="105" fill="#EAF6F4"/>
<text x="904.5" y="480.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="904.5" dy="0">10³–10⁴</tspan></text>
<rect x="1032" y="416" width="816" height="105" fill="#EAF6F4"/>
<text x="1054" y="462.25" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="1054" dy="0">Automated synthesis and DNA libraries</tspan><tspan x="1054" dy="31.25">can expand construction capacity.</tspan></text>
<line x1="72" y1="521" x2="1848" y2="521" stroke="#D7E3E8"/>
<rect x="72" y="521" width="515" height="105" fill="#EAF6F4"/>
<text x="94" y="582.875" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#007D80" text-anchor="start"><tspan x="94" dy="0">Fully profiled in wet lab</tspan></text>
<rect x="587" y="521" width="190" height="105" fill="#EAF6F4"/>
<text x="682" y="585.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#007D80" text-anchor="middle"><tspan x="682" dy="0">~50</tspan></text>
<rect x="777" y="521" width="255" height="105" fill="#EAF6F4"/>
<text x="904.5" y="585.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#007D80" text-anchor="middle"><tspan x="904.5" dy="0">50 → 500</tspan></text>
<rect x="1032" y="521" width="816" height="105" fill="#EAF6F4"/>
<text x="1054" y="567.25" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#007D80" text-anchor="start"><tspan x="1054" dy="0">Illustrative capacity expansion</tspan><tspan x="1054" dy="31.25">that investors would need to fund.</tspan></text>
<line x1="72" y1="626" x2="1848" y2="626" stroke="#D7E3E8"/>
<rect x="72" y="626" width="515" height="105" fill="#FAF5EB"/>
<text x="94" y="687.875" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="94" dy="0">Clinical entry</tspan></text>
<rect x="587" y="626" width="190" height="105" fill="#FAF5EB"/>
<text x="682" y="690.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="682" dy="0">1</tspan></text>
<rect x="777" y="626" width="255" height="105" fill="#FAF5EB"/>
<text x="904.5" y="690.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="904.5" dy="0">1</tspan></text>
<rect x="1032" y="626" width="816" height="105" fill="#FAF5EB"/>
<text x="1054" y="672.25" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="1054" dy="0">Patients, ethics, capital and time</tspan><tspan x="1054" dy="31.25">remain hard constraints.</tspan></text>
<line x1="72" y1="731" x2="1848" y2="731" stroke="#D7E3E8"/>
<rect x="72" y="731" width="515" height="105" fill="#FAF5EB"/>
<text x="94" y="792.875" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="94" dy="0">Expected approvals</tspan></text>
<rect x="587" y="731" width="190" height="105" fill="#FAF5EB"/>
<text x="682" y="795.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="682" dy="0">~0.14</tspan></text>
<rect x="777" y="731" width="255" height="105" fill="#FAF5EB"/>
<text x="904.5" y="795.5" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="400" fill="#152C3A" text-anchor="middle"><tspan x="904.5" dy="0">Unknown</tspan></text>
<rect x="1032" y="731" width="816" height="105" fill="#FAF5EB"/>
<text x="1054" y="777.25" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#152C3A" text-anchor="start"><tspan x="1054" dy="0">Clinical success must be demonstrated;</tspan><tspan x="1054" dy="31.25">AI does not establish an approval rate.</tspan></text>
<line x1="72" y1="836" x2="1848" y2="836" stroke="#D7E3E8"/>
<rect x="72" y="877" width="1776" height="98" rx="10" fill="#152C3A" stroke="none" stroke-width="1"/>
<image x="95" y="899" width="52" height="52" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<text x="171" y="922.52" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="171" dy="0">Working thesis: experimental throughput becomes a capacity gate as virtual design scales.</tspan></text>
<text x="72" y="1022.28" fill="#647887" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Source: user-supplied comparison. ~0.14 is an illustrative expected approval count per clinical entrant; the AI-era outcome is unknown.</tspan></text>
</svg>