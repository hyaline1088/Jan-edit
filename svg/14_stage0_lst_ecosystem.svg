<text x="91" y="910.3" font-family="Arial,Arial Unicode MS,sans-serif" font-size="17" font-weight="400" fill="#647887" text-anchor="start"><tspan x="91" dy="0">AIDD-Ready offering exists; paid orders and repeat purchases still need verification</tspan></text>
