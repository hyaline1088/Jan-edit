<text x="72" y="1044.85" font-family="Arial,Arial Unicode MS,sans-serif" font-size="16.5" font-weight="400" fill="#647887" text-anchor="start"><tspan x="72" dy="0">Instrument CAPEX is separate. Product alignment does not establish AI orders or revenue. Sources: Ginkgo, Sartorius and company websites.</tspan></text>
